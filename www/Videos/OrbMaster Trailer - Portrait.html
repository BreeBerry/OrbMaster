<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrbMaster — Trailer (Portrait 9:16)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #07030f; overflow: hidden; }
  #root { position: fixed; inset: 0; }
  /* variant switcher — page chrome, excluded from the exported SVG */
  .switch { position: fixed; top: 14px; left: 50%; transform: translateX(-50%); z-index: 50;
    display: flex; gap: 6px; padding: 6px; border-radius: 999px;
    background: rgba(20,12,30,0.85); border: 1px solid rgba(124,58,237,0.4); backdrop-filter: blur(8px); }
  .switch button { font-family: "Roboto Mono", monospace; font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    color: #c4b5fd; background: transparent; border: none; border-radius: 999px; padding: 7px 16px; cursor: pointer; text-transform: uppercase; }
  .switch button.on { background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; }
  .hint { position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%); z-index: 50;
    font-family: "Roboto Mono", monospace; font-size: 11px; color: rgba(168,139,250,0.6); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="animations.jsx"></script>
<script type="text/babel" src="atoms.jsx"></script>
<script type="text/babel" src="scenes.jsx"></script>
<script type="text/babel" src="trailer.jsx"></script>
<script type="text/babel">
  const { Stage } = window;
  const { useState } = React;
  const VARIANTS = [
    { id: 'mindbreaker', label: 'Villain' },
    { id: 'crack', label: 'Gameplay' },
    { id: 'climb', label: 'Ranked' },
  ];

  function App() {
    const [variant, setVariant] = useState('mindbreaker');
    const { Trailer, AudioSync } = window.OM_TRAILER;
    return (
      <>
        <div className="switch">
          {VARIANTS.map((v) => (
            <button key={v.id} className={v.id === variant ? 'on' : ''} onClick={() => setVariant(v.id)}>{v.label}</button>
          ))}
        </div>
        <Stage key={variant} width={1080} height={1920} duration={30} background="#07030f" persistKey={'om-trailer-port-' + variant}>
          <AudioSync />
          <Trailer variant={variant} W={1080} H={1920} port={true} />
        </Stage>
        <div className="hint">Space play/pause · ← → seek · ↓ download button on bar exports MP4</div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
